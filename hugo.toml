baseURL = "https://julienlamcnrs.github.io/"
locale = "en-us"
title = "Julien Lam's homepage"
theme = "LoveIt"
defaultContentLanguage = "en"

# ------------------------------------------------------------
# Réglages globaux (valeurs du thème que l'on surcharge)
# ------------------------------------------------------------
[params]
  # Toujours en mode clair (le bouton clair/sombre est masqué par le CSS)
  defaultTheme = "light"

  # Pas de boutons de partage (X, Facebook, Telegram, ...)
  [params.page.share]
    enable = false

  # Pas de table des matières « CONTENTS » sur les pages
  [params.page.toc]
    enable = false

  # Pied de page : « © 2020 - 2026 Julien Lam » au lieu de « xxxx »
  [params.author]
    name = "Julien Lam"
  [params.footer]
    since = 2020

# ------------------------------------------------------------
# Langue
# ------------------------------------------------------------
[languages.en]
  weight = 1
  title = "Julien Lam's homepage"
  languageCode = "en"
  languageName = "English"
  hasCJKLanguage = false

# ------------------------------------------------------------
# Menu
# ------------------------------------------------------------
[languages.en.menu]
  [[languages.en.menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 1
  [[languages.en.menu.main]]
    identifier = "publications"
    name = "Publications"
    url = "/publications/"
    weight = 2
  [[languages.en.menu.main]]
    identifier = "people"
    name = "People"
    url = "/people/"
    weight = 3
  [[languages.en.menu.main]]
    identifier = "conferences"
    name = "Conferences"
    url = "/conferences/"
    weight = 4
  [[languages.en.menu.main]]
    identifier = "cv"
    name = "CV"
    url = "https://drive.google.com/file/d/1SGtyz0dmO8ujEaCr81rFzhJOwxd1pwRn/view?usp=drive_link"
    weight = 5
  [[languages.en.menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "mailto:julien.lam(at)cnrs.fr"
    weight = 6

# ------------------------------------------------------------
# Paramètres de la langue : description, en-tête, accueil, liens
# ------------------------------------------------------------
[languages.en.params]
  description = "Julien Lam, permanent CNRS researcher at UMET (Lille)"
  keywords = ["nucleation", "crystallization", "machine learning", "molecular simulation"]

  [languages.en.params.header.title]
    name = "Julien Lam's homepage"

  [languages.en.params.home]
    rss = 10

    # Profil en haut de l'accueil
    [languages.en.params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "/images/2020/11/received_134163431494541.jpeg"
      title = "Julien Lam"
      subtitle = "Permanent CNRS researcher · UMET, Université de Lille"
      typeit = false
      social = true
      disclaimer = "<p class='hero-tagline'>Machine-learning potentials and rare-event sampling to understand how nanocrystals nucleate and grow.</p><div class='hero-chips'><span>Nucleation</span><span>Crystallization</span><span>ML interaction potentials</span><span>Free-energy sampling</span><span>Nanoparticle synthesis</span></div>"

    # Liste des news (le « Newsfeed »)
    [languages.en.params.home.posts]
      enable = true
      paginate = 6

  # Liens sociaux
  [languages.en.params.social]
    Orcid = "0000-0003-0343-6005"
    Googlescholar = "ojOMsZIAAAAJ"
    Researchgate = "Julien_Lam"
