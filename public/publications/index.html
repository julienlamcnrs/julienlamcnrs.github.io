(function () {
  const root = document.querySelector('.pub-page');
  if (!root || root.dataset.ready) return;
  root.dataset.ready = 'true';
  const search = root.querySelector('#pub-search');
  const filter = root.querySelector('#pub-filter');
  const items = Array.from(root.querySelectorAll('.pub-item'));
  const count = root.querySelector('#pub-count');
  const empty = root.querySelector('#pub-empty');

  function update() {
    const q = search.value.trim().toLowerCase();
    let visible = 0;
    items.forEach(item => {
      const matchesText = (item.dataset.search || '').toLowerCase().includes(q);
      const matchesStatus = filter.value === 'all' || item.dataset.status === filter.value;
      const show = matchesText && matchesStatus;
      item.hidden = !show;
      if (show) visible++;
    });
    count.textContent = visible + (visible === 1 ? ' publication' : ' publications');
    empty.hidden = visible !== 0;
  }
  search.addEventListener('input', update);
  filter.addEventListener('change', update);
  root.querySelectorAll('.pub-bib-button').forEach(button => {
    button.addEventListener('click', async () => {
      const bib = button.dataset.bib || '';
      try {
        await navigator.clipboard.writeText(bib);
        const old = button.textContent;
        button.textContent = 'Copied!';
        setTimeout(() => button.textContent = old, 1400);
      } catch (e) {
        const field = document.createElement('textarea');
        field.value = bib;
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        field.select();
        document.execCommand('copy');
        field.remove();
        button.textContent = 'Copied!';
        setTimeout(() => button.textContent = 'Copy BibTeX', 1400);
      }
    });
  }); 
})();
</script>
